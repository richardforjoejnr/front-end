<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Feathers Example</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@2.46.1/dist/full.css" rel="stylesheet" type="text/css" />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2/dist/tailwind.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="https://feathersjs.com/feathers-chat.css" />
  </head>
  <body data-theme="dracula">
    <section id="login" class="p-8 hidden" data-test="login-page">
      <h1 class="font-medium leading-tight text-5xl mt-0 mb-2" data-test="login-title">
        Welcome to Feathers
      </h1>

      <form class="w-full max-w-sm py-2" data-test="login-form" onsubmit="signIn(event)">
        <div
          class="alert alert-error my-2 hidden"
          role="alert"
          data-test="login-error-alert"
        ></div>

        <label class="label" for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          autocomplete="username"
          required
          class="input input-bordered w-full"
          data-test="login-email-input"
        />

        <label class="label" for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          autocomplete="current-password"
          required
          class="input input-bordered w-full"
          data-test="login-password-input"
        />

        <div class="flex gap-2 pt-4">
          <button type="submit" class="btn btn-primary" data-test="login-submit-button">
            Sign in
          </button>
          <button
            type="button"
            class="btn"
            data-test="login-register-button"
            onclick="register(event)"
          >
            Register
          </button>
        </div>
      </form>
    </section>

    <main id="main" class="p-8 hidden" data-test="chat-page">
      <div class="flex items-center justify-between gap-4">
        <h1 class="font-medium leading-tight text-5xl mt-0 mb-2" data-test="chat-title">
          Welcome to Feathers
        </h1>
        <div class="flex items-center gap-3">
          <span class="text-sm opacity-70" data-test="chat-current-user"></span>
          <button type="button" class="btn btn-sm" data-test="chat-logout-button" onclick="logout()">
            Sign out
          </button>
        </div>
      </div>

      <div class="form-control w-full py-2">
        <form
          class="input-group overflow-hidden"
          data-test="chat-send-form"
          onsubmit="sendMessage(event)"
        >
          <input
            name="message"
            id="message-text"
            type="text"
            class="input input-bordered w-full"
            aria-label="Message"
            data-test="chat-message-input"
          />
          <button type="submit" class="btn" data-test="chat-send-button">Send</button>
        </form>
      </div>
      <h2 class="pt-1 pb-2 text-lg" data-test="chat-messages-title">Messages</h2>

      <div data-test="chat-messages-list"></div>
    </main>

    <script src="//unpkg.com/@feathersjs/client@^5.0.0/dist/feathers.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="text/javascript">
      // Set up socket.io, connecting back to whichever host/port served this page
      const socket = io()
      const app = feathers()
      app.configure(feathers.socketio(socket))
      // The JWT lives in localStorage so a reload can resume the session
      app.configure(feathers.authentication({ storage: window.localStorage }))

      const loginSection = document.getElementById('login')
      const chatSection = document.getElementById('main')
      const loginError = document.querySelector('[data-test="login-error-alert"]')
      const currentUser = document.querySelector('[data-test="chat-current-user"]')

      function showLoginError(message) {
        loginError.textContent = message
        loginError.classList.remove('hidden')
      }

      function clearLoginError() {
        loginError.textContent = ''
        loginError.classList.add('hidden')
      }

      function showLogin() {
        chatSection.classList.add('hidden')
        loginSection.classList.remove('hidden')
      }

      async function showChat(user) {
        currentUser.textContent = user.email
        loginSection.classList.add('hidden')
        chatSection.classList.remove('hidden')
        await loadMessages()
      }

      function credentials() {
        return {
          email: document.querySelector('[data-test="login-email-input"]').value,
          password: document.querySelector('[data-test="login-password-input"]').value
        }
      }

      async function signIn(event) {
        event.preventDefault()
        clearLoginError()

        try {
          const { user } = await app.authenticate({ strategy: 'local', ...credentials() })

          await showChat(user)
        } catch (error) {
          // Never say which of the two was wrong — that would confirm an email exists
          showLoginError('Invalid email or password')
        }
      }

      async function register() {
        clearLoginError()

        const { email, password } = credentials()

        if (!email || !password) {
          showLoginError('Enter an email and password to register')
          return
        }

        try {
          await app.service('users').create({ email, password })
          const { user } = await app.authenticate({ strategy: 'local', email, password })

          await showChat(user)
        } catch (error) {
          showLoginError(error.message || 'Could not register')
        }
      }

      async function logout() {
        await app.logout()
        // Reload rather than unpicking the rendered messages by hand
        window.location.reload()
      }

      async function sendMessage(event) {
        const messageInput = document.getElementById('message-text')

        event.preventDefault()

        await app.service('messages').create({
          text: messageInput.value
        })

        messageInput.value = ''
      }

      // Static markup only, never user content
      const trashIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>`

      const messagesList = document.querySelector('[data-test="chat-messages-list"]')

      // The rendered element of every message on the page, by message id
      const messageElements = new Map()

      function removeMessage(message) {
        const chat = messageElements.get(message._id)

        if (chat) {
          chat.remove()
          messageElements.delete(message._id)
        }
      }

      // Deletes a message on the server. The page is updated by the
      // `removed` event, which every connected client receives
      async function deleteMessage(message, button) {
        button.disabled = true

        try {
          await app.service('messages').remove(message._id)
        } catch (error) {
          if (error.code === 404) {
            // Somebody else already deleted it
            removeMessage(message)
          } else {
            button.disabled = false
            console.error('Could not delete message', error)
          }
        }
      }

      // Locators follow docs/playwright-locator-strategy.md: {scope}-{component}-{variant}
      function addMessage(message) {
        const chat = document.createElement('div')
        const bubble = document.createElement('div')
        const text = document.createElement('span')
        const deleteButton = document.createElement('button')

        chat.className = 'chat chat-start'
        chat.dataset.test = `chat-messages-list-item-${message._id}`
        chat.dataset.messageId = message._id

        bubble.className = 'chat-bubble flex items-center gap-2'

        // textContent, not innerHTML: message text comes from other users
        text.textContent = message.text
        text.dataset.test = `chat-messages-list-item-text-${message._id}`

        deleteButton.type = 'button'
        deleteButton.className = 'btn btn-ghost btn-xs btn-circle'
        deleteButton.title = 'Delete message'
        deleteButton.setAttribute('aria-label', 'Delete message')
        deleteButton.dataset.test = `chat-messages-list-item-delete-button-${message._id}`
        deleteButton.innerHTML = trashIcon
        deleteButton.addEventListener('click', () => deleteMessage(message, deleteButton))

        bubble.appendChild(text)
        bubble.appendChild(deleteButton)
        chat.appendChild(bubble)
        messagesList.appendChild(chat)
        messageElements.set(message._id, chat)
      }

      let messagesLoaded = false

      const loadMessages = async () => {
        if (messagesLoaded) {
          return
        }
        messagesLoaded = true

        // Find the latest 25 messages. The service is paginated, so the
        // result is a `{ total, limit, skip, data }` page and not an array
        const messages = await app.service('messages').find({
          query: {
            $sort: { createdAt: -1 },
            $limit: 25
          }
        })

        // Oldest first
        messages.data.reverse().forEach(addMessage)

        // The page is only ever updated from these events, so every tab stays in sync
        app.service('messages').on('created', addMessage)
        app.service('messages').on('removed', removeMessage)
      }

      // A stored JWT resumes the session; anything else means signing in
      app
        .reAuthenticate()
        .then(({ user }) => showChat(user))
        .catch(() => showLogin())
    </script>
  </body>
</html>
